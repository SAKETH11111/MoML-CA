training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  optimizer: "Adam"
  early_stopping: true
  patience: 10
  validation_split: 0.2

mgnn:
  hidden_channels: 128
  num_layers: 3
  dropout: 0.2
  readout: "mean"
  jk_mode: "cat"
  graph_output_dims: 19
  node_output_dims: 3
  in_node_dim: 11
  energy_output_dims: 1

lstm:
  hidden_size: 64
  num_layers: 2
  bidirectional: false
  dropout: 0.1
  sequence_length: 50

logging:
  log_interval: 10
  checkpoint_interval: 5
