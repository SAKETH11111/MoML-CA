[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moml-ca"
version = "0.1.0"
description = "Molecular Modeling and Machine Learning for Contaminant Analysis"
readme = "README.md"
requires-python = ">=3.8, <4"
license = {text = "MIT"}
authors = [
    {name = "Saketh", email = "sakethbaddam10@gmail.com"},
    {name = "Daniel", email = "danielumemezie@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
keywords = ["computational chemistry", "machine learning", "PFAS", "contaminants", "molecular graphs"]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "torch>=1.10.0",
    "OpenMM>=7.5.0",
    "mdtraj>=1.9.5",
    "pdb-tools",
    "rdkit>=2022.03.2",
    "deepchem>=2.5.0",
    "mordred>=1.2.0",
    "networkx>=2.6.0",
    "plotly>=5.3.0",
    "pyyaml>=6.0",
    "h5py>=3.6.0",
    "luigi>=3.0.0",
    "dask>=2022.1.0",
    "distributed>=2022.1.0",
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.5",
    "black>=21.12b0",
    "flake8>=4.0.0",
    "isort>=5.10.0",
]

[project.urls]
Homepage = "https://github.com/saketh/MoML-CA"
Documentation = "https://github.com/saketh/MoML-CA#readme"
Repository = "https://github.com/saketh11111/MoML-CA"
Issues = "https://github.com/saketh11111/MoML-CA/issues"

[project.scripts]
moml-ca = "moml.pipeline.pipeline_orchestrator:main"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q" 